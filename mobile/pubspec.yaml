name: nova_ai
description: Jarvis - Your personal AI friend
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3

  # Local DB cache
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.0

  # State management
  flutter_riverpod: ^2.5.1

  # Voice / Audio
  speech_to_text: ^7.0.0       # STT + wake word detection (v7 uses v2 Android embedding)
  flutter_tts: ^4.0.2          # TTS playback (Google TTS on Android)
  record: ^5.1.2               # Microphone recording
  just_audio: ^0.9.40          # Audio playback for backend TTS

  # Permissions
  permission_handler: ^11.3.1

  # UI
  flutter_markdown: ^0.6.20
  lottie: ^3.1.0
  google_fonts: ^6.2.1

  # Phone control bridge
  web_socket_channel: ^2.4.0

  # Utils
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

dependency_overrides:
  # record_linux 0.7.2 is incompatible with record_platform_interface 1.6.0;
  # override to 1.3.1 which is API-compatible on all platforms.
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
